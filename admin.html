<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Jasbaan Admin</title>
<style>
:root{--bg:#0A0907;--card:#14110C;--gold:#D4AF5A;--ivory:#F4EBDA;--mut:#CBB89A;--line:#2E2616}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ivory);font:15px/1.5 system-ui,sans-serif}
header{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.8rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header b{color:var(--gold);letter-spacing:.12em;margin-right:auto}main{padding:1rem;max-width:1100px;margin:auto}
button,.b{background:var(--gold);color:#0A0907;border:0;border-radius:4px;padding:.5rem .9rem;font:600 .85rem system-ui;cursor:pointer}
button.o{background:none;color:var(--gold);border:1px solid var(--gold)}button.r{background:#8a2b2b;color:#fff}.tab.on{outline:2px solid var(--ivory)}
input,select,textarea{width:100%;background:#0d0b08;color:var(--ivory);border:1px solid var(--line);border-radius:4px;padding:.5rem;font:inherit}
label{display:block;font-size:.78rem;color:var(--mut);margin:.6rem 0 .15rem}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.row{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.6rem;margin:.5rem 0}.row img{width:54px;height:68px;object-fit:cover;border-radius:3px}
.row>div{flex:1;min-width:0}small{color:var(--mut)}.st{padding:.5rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:6px}.st b{display:block;font-size:1.4rem;color:var(--gold)}
table{width:100%;border-collapse:collapse}td,th{padding:.55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.88rem}th{color:var(--gold)}tr.c{cursor:pointer}tr.c:hover{background:var(--card)}
dialog{background:var(--card);color:var(--ivory);border:1px solid var(--gold);border-radius:8px;width:min(680px,94vw);max-height:92vh}::backdrop{background:#000a}
.badge{padding:.1rem .5rem;border-radius:99px;background:#2a2312;color:var(--gold);font-size:.75rem}#msg{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:.5rem 1rem;border-radius:6px;display:none;z-index:9}
.scroll{overflow-x:auto}
.ln2{display:grid;grid-template-columns:1.3fr 1.3fr .5fr .7fr auto;gap:.4rem;margin:.3rem 0}@media(max-width:600px){.ln2{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><b>JASBAAN ADMIN</b><button class="tab o" data-t="orders">Orders</button><button class="tab o" data-t="products">Products</button><button class="tab o" data-t="settings">Settings</button></header>
<main id="m"></main><dialog id="dlg"></dialog><div id="msg"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=JSON.parse(localStorage.getItem('jbadmin')||'{}');S={branch:'main',storeName:'The Jasbaan Perfume',storePhone:'0371 2272628',...S};
const persist=()=>localStorage.setItem('jbadmin',JSON.stringify(S)),pkr=n=>'PKR '+Number(n||0).toLocaleString('en-US');
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3500)};
const STAT=['New','Confirmed','Shipped','Delivered','Cancelled'];let P=[],sha='',O=[],tab='orders';
/* ---------- GitHub (products) ---------- */
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const ghErr=(r,j,repo,br)=>Error((j.message||'Error '+r.status)+(r.status===401?' | Token galat ya expire hai, naya token banayein.':r.status===404?' | Repo ka naam "'+repo+'" galat hai, ya branch "'+br+'" galat hai, ya token ko is repo ki Contents (Read and write) permission nahi mili.':r.status===403?' | Token ko Contents: Read and write permission chahiye.':''));
const ghDirect=async(path,opt)=>{const repo=S.repo.trim().replace(/^(https?:\/\/)?(www\.)?github\.com\//i,'').replace(/\.git$/,'').replace(/^\/+|\/+$/g,''),br=(S.branch||'main').trim()||'main';let r;
 try{r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`+(opt.method?'':`?ref=${encodeURIComponent(br)}`),{...opt,headers:{Authorization:'Bearer '+S.token.trim(),Accept:'application/vnd.github+json'}})}
 catch(e){const x=Error('Browser GitHub (api.github.com) tak pahunch nahi paya ('+e.message+').');x.net=true;throw x}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw ghErr(r,j,repo,br);return j};
const ghServer=async(path,opt,why)=>{let r;
 try{r=await fetch('/api/github',{method:'POST',headers:{'x-admin-key':S.key||'','Content-Type':'application/json'},body:JSON.stringify({path,method:opt.method||'GET',body:opt.body?JSON.parse(opt.body):undefined})})}
 catch(e){throw Error((why||'')+' Server se bhi connect nahi hua ('+e.message+'). Admin page apni site ke address (https://...) se kholein.')}
 const j=await r.json().catch(()=>({}));
 if(j.notConfigured)throw Error((why?why+' ':'')+j.message);
 if(r.status===413)throw Error('Photo bohat badi hai, 3 MB se chhoti photo upload karein.');
 if(!r.ok)throw ghErr(r,j,'repo','branch');return j};
const gh=async(path,opt={})=>{if(!S.repo||!S.token)return ghServer(path,opt,'Settings mein GitHub repo aur token nahi hain.');
 try{return await ghDirect(path,opt)}catch(e){if(!e.net)throw e;return ghServer(path,opt,e.message)}};
const loadP=async()=>{const r=await gh('products.js'),t=unb64(r.content);sha=r.sha;P=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1))};
const saveP=async msg=>{const r=await gh('products.js',{method:'PUT',body:JSON.stringify({message:msg,branch:(S.branch||'main').trim()||'main',sha,
 content:b64('/* Product data. Edit through admin.html (or by hand: keep valid JSON). */\nconst PRODUCTS = '+JSON.stringify(P,null,1)+';\n')})});sha=r.content.sha;toast('Saved. Site 1-2 minute mein update ho jayegi.')};
/* ---------- Products ---------- */
const F=[['name','Name'],['id','ID (link, no spaces)'],['cat','Category'],['gender','Gender','Men,Women,Unisex'],['price','Price PKR (empty = Price on WhatsApp)','n'],['sale','Sale price (optional)','n'],['tag','Badge text (e.g. Launch offer)'],['size','Size'],['tagline','Tagline'],['lasting','Lasting'],['season','Season'],['occasion','Occasion']];
const viewP=async()=>{$('#m').innerHTML='<p>Loading...</p>';try{await loadP()}catch(e){return $('#m').innerHTML='<p>'+esc(e.message)+'</p>'}
 $('#m').innerHTML=`<button onclick="editP(-1)">+ Add product</button>`+P.map((p,i)=>`<div class="row"><img src="${esc(p.img)}" alt=""><div><b>${esc(p.name)}</b> ${p.best?'<span class=badge>Best seller</span>':''}<br><small>${esc(p.cat)} | ${esc(p.gender)} | ${p.price==null?'Price on WhatsApp':pkr(p.price)}${p.sale?' (sale '+pkr(p.sale)+')':''}</small></div>
 <button class="o" onclick="mv(${i},-1)">↑</button><button class="o" onclick="mv(${i},1)">↓</button><button onclick="editP(${i})">Edit</button></div>`).join('')};
const mv=async(i,d)=>{const j=i+d;if(j<0||j>=P.length)return;[P[i],P[j]]=[P[j],P[i]];try{await saveP('Reorder products');viewP()}catch(e){toast(e.message)}};
const editP=i=>{const p=i<0?{img:'',best:false,points:[]}:P[i];$('#dlg').innerHTML=`<form id="pf"><h3>${i<0?'New product':'Edit '+esc(p.name)}</h3><div class="g">`+F.map(([k,l,t])=>`<div><label>${l}</label>`+(t&&t!=='n'?`<select name="${k}">${t.split(',').map(o=>`<option ${p[k]==o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${k}" ${t==='n'?'type=number min=0':''} value="${esc(p[k]??'')}">`)+'</div>').join('')+`</div>
 <label>Description</label><textarea name="desc" rows="3">${esc(p.desc)}</textarea><label>Highlights (one per line)</label><textarea name="points" rows="3">${esc((p.points||[]).join('\n'))}</textarea>
 <label>Long text (product page, optional)</label><textarea name="long" rows="3">${esc(p.long)}</textarea><label>Fragrance notes (only if confirmed)</label><input name="notes" value="${esc(p.notes)}">
 <label>Main photo ${p.img?'(current: '+esc(p.img)+')':''}</label><input type="file" name="f1" accept="image/*"><label>Second photo (optional)</label><input type="file" name="f2" accept="image/*">
 <label><input type="checkbox" name="best" ${p.best?'checked':''} style="width:auto"> Best seller</label><p style="display:flex;gap:.6rem;margin-top:1rem"><button>Save</button><button type="button" class="o" onclick="$('#dlg').close()">Cancel</button>${i>=0?'<button type="button" class="r" onclick="delP('+i+')" style="margin-left:auto">Delete</button>':''}</p></form>`;
 $('#dlg').showModal();$('#pf').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),n={...p};
  try{F.forEach(([k,,t])=>{const v=String(d.get(k)||'').trim();n[k]=t==='n'?(v===''?null:+v):v});
   ['desc','long','notes'].forEach(k=>n[k]=String(d.get(k)||'').trim());n.points=String(d.get('points')).split('\n').map(s=>s.trim()).filter(Boolean);n.best=d.get('best')==='on';
   n.id=n.id.toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'')||'product-'+Date.now();if(!n.name)throw Error('Name zaroori hai');
   if(P.some((x,j)=>x.id===n.id&&j!==i))throw Error('Ye ID pehle se maujood hai');
   for(const [f,k] of [['f1','img'],['f2','img2']]){const file=d.get(f);if(file&&file.size){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''),path=`images/${n.id}${k==='img2'?'-2':''}-${Date.now()}.${ext}`;
     const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file)});
     await gh(path,{method:'PUT',body:JSON.stringify({message:'Upload '+path,branch:(S.branch||'main').trim()||'main',content:data})});n[k]=path}}
   if(i<0)P.unshift(n);else P[i]=n;await saveP((i<0?'Add ':'Update ')+n.name);$('#dlg').close();viewP()}catch(er){toast(er.message)}}};
const delP=async i=>{if(!confirm('Delete '+P[i].name+'?'))return;const n=P[i].name;P.splice(i,1);try{await saveP('Delete '+n);$('#dlg').close();viewP()}catch(e){toast(e.message)}};
/* ---------- Orders ---------- */
const api=async q=>{const ext=/^https?:/.test(S.orderUrl||'');if(!S.key)throw Error('Settings mein Admin key daalein');
 const r=ext?await(await fetch(S.orderUrl+'?key='+encodeURIComponent(S.key)+q)).json():await(await fetch('/api/admin?'+q.slice(1),{headers:{'x-admin-key':S.key}})).json();if(!r.ok)throw Error(r.error||'Error');return r};
const dt=s=>new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const post=async b=>{if(!S.key)throw Error('Settings mein Admin key daalein');
 if(/^https?:/.test(S.orderUrl||'')){const e=encodeURIComponent,q=b.action==='add'?'&action=add&data='+e(JSON.stringify(b.order)):'&action='+b.action+'&id='+e(b.id)+(b.action==='update'?'&courier='+e(b.courier)+'&track='+e(b.track)+'&note='+e(b.note):'');
  const r=await(await fetch(S.orderUrl+'?key='+e(S.key)+q)).json();if(!r.ok)throw Error(r.error||'Error');return r}
 const r=await(await fetch('/api/admin',{method:'POST',headers:{'x-admin-key':S.key,'Content-Type':'application/json'},body:JSON.stringify(b)})).json();if(!r.ok)throw Error(r.error||'Error');return r};
const site=async(f,a,z)=>{try{const r=await fetch(f+'?_='+Date.now());if(!r.ok)throw 0;const t=await r.text();return JSON.parse(t.slice(t.indexOf(a),t.lastIndexOf(z)+1))}catch(e){return null}};
let fS='',fQ='',fR='',N=0,VL=[];
const viewO=async()=>{$('#m').innerHTML='<p>Loading...</p>';try{const r=await api('&action=list');O=r.orders;N=r.count||O.length}catch(e){return $('#m').innerHTML='<p>'+esc(e.message)+'</p>'}drawO()};
const inR=(o,r)=>{if(!r)return true;const d=new Date(o.date),n=new Date();return r==='today'?d.toDateString()===n.toDateString():n-d<=Number(r)*864e5};
const drawO=(f=fS,q=fQ,r=fR)=>{fS=f;fQ=q;fR=r;const td=new Date().toDateString(),L=VL=O.filter(o=>(!f||o.status===f)&&inR(o,r)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));
 const live=O.filter(o=>o.status!=='Cancelled'),cnt=s=>O.filter(o=>o.status===s).length;
 $('#m').innerHTML=`<div class="g" style="margin-bottom:1rem"><div class=st><small>Today</small><b>${O.filter(o=>new Date(o.date).toDateString()===td).length}</b></div><div class=st><small>New (pending)</small><b>${cnt('New')}</b></div><div class=st><small>To ship (Confirmed)</small><b>${cnt('Confirmed')}</b></div><div class=st><small>Delivered</small><b>${cnt('Delivered')}</b></div><div class=st><small>Total orders</small><b>${N>O.length?N:O.length}</b></div><div class=st><small>Sales (not cancelled)</small><b>${pkr(live.reduce((a,o)=>a+Number(o.total||0),0))}</b></div></div>
 <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem"><input id="q" placeholder="Search name, phone, city, ID, tracking" value="${esc(q)}" style="flex:1;min-width:180px"><select id="f" style="width:auto"><option value="">All status</option>${STAT.map(s=>`<option value="${s}" ${f===s?'selected':''}>${s} (${cnt(s)})</option>`).join('')}</select><select id="rg" style="width:auto">${[['','All time'],['today','Today'],['7','Last 7 days'],['30','Last 30 days']].map(([v,l])=>`<option value="${v}" ${r===v?'selected':''}>${l}</option>`).join('')}</select><button class="o" onclick="viewO()">Refresh</button><button onclick="newO()">+ New order</button><button class="o" onclick="csv()">Export CSV</button><button onclick="printAll()">Print labels (New+Confirmed)</button></div>
 <p><small>Showing ${L.length} of ${O.length} orders${N>O.length?' (latest '+O.length+' loaded, '+N+' in total)':''}</small></p>
 <div class="scroll"><table><tr><th>Order</th><th>Customer</th><th>City</th><th>Total</th><th>Status</th></tr>${L.map(o=>`<tr class="c" data-id="${esc(o.id)}"><td>${esc(o.id)}<br><small>${dt(o.date)}</small></td><td>${esc(o.name)}<br><small>${esc(o.phone)}</small></td><td>${esc(o.city)}</td><td>${pkr(o.total)}<br><small>${esc(o.pay)} | ${esc(o.paid||'Unpaid')}</small></td><td><span class=badge>${esc(o.status)}</span>${o.track?'<br><small>'+esc(o.courier)+' '+esc(o.track)+'</small>':''}</td></tr>`).join('')||'<tr><td colspan=5>No orders</td></tr>'}</table></div>`;
 $('#q').oninput=e=>drawO($('#f').value,e.target.value.toLowerCase(),$('#rg').value);$('#f').onchange=e=>drawO(e.target.value,$('#q').value.toLowerCase(),$('#rg').value);$('#rg').onchange=e=>drawO($('#f').value,$('#q').value.toLowerCase(),e.target.value);
 document.querySelectorAll('tr.c').forEach(t=>t.onclick=()=>det(t.dataset.id));$('#q').focus();$('#q').setSelectionRange(q.length,q.length)};
const det=id=>{const o=O.find(x=>x.id===id);if(!o)return toast('Order nahi mila, Refresh karein');const ph=String(o.phone).replace(/\D/g,'').replace(/^0/,'92'),wa=t=>'https://wa.me/'+ph+'?text='+encodeURIComponent(t),its=o.items.map(i=>i.name+' x '+i.qty).join(', '),
 w1=wa(`Assalam o Alaikum ${o.name}, ${S.storeName} se aap ka order ${o.id} receive ho gaya hai.\n${its}\nTotal: ${pkr(o.total)} (${o.pay}).\nKya aap order confirm karte hain?`),
 w2=wa(`Assalam o Alaikum ${o.name}, aap ka order ${o.id} dispatch ho gaya hai.`+(o.track?`\nCourier: ${o.courier||'-'}\nTracking: ${o.track}`:'')+`\nOrder track ya cancel karne ke liye: ${location.origin}/#track-${o.id}\nShukriya, ${S.storeName}.`),
 hist=(o.history||[]).map(h=>`${esc(h.s)} <small>(${dt(h.at)})</small>`).join(' &rarr; ');
 $('#dlg').innerHTML=`<h3>${esc(o.id)} <span class=badge>${esc(o.status)}</span></h3><small>${dt(o.date)}</small>
 <p><b>${esc(o.name)}</b> | <a style="color:var(--gold)" href="tel:${esc(o.phone)}">${esc(o.phone)}</a> | <a style="color:var(--gold)" target=_blank rel=noopener href="https://wa.me/${esc(ph)}">WhatsApp</a><br>${esc(o.addr)}, ${esc(o.city)}</p>
 <table>${o.items.map(i=>`<tr><td>${esc(i.name)} x ${esc(i.qty)}</td><td>${pkr(i.price*i.qty)}</td></tr>`).join('')}<tr><td>Delivery</td><td>${pkr(o.fee)}</td></tr><tr><td><b>Total (${esc(o.pay)})</b></td><td><b>${pkr(o.total)}</b></td></tr></table>
 <p><small>Payment: ${esc(o.pay)}${o.tid?' | Ref: <b>'+esc(o.tid)+'</b>':''} | <b>${esc(o.paid||'Unpaid')}</b></small></p><p><small>Placed from: ${esc(o.source)}<br>Device: ${esc(o.device)}</small></p>${hist?'<p><small>History: '+hist+'</small></p>':''}<label>Payment status</label><select id="np">${['Unpaid','Pending','Paid'].map(s=>`<option ${(o.paid||'Unpaid')===s?'selected':''}>${s}</option>`).join('')}</select><label>Status</label><select id="ns">${STAT.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>
 <label>Courier</label><input id="nc" list="cl" maxlength="40" value="${esc(o.courier)}" placeholder="TCS, Leopards, PostEx..."><datalist id="cl"><option>TCS</option><option>Leopards</option><option>M&amp;P</option><option>PostEx</option><option>Trax</option><option>BlueEx</option><option>Pakistan Post</option></datalist>
 <label>Tracking number</label><input id="nt" maxlength="60" value="${esc(o.track)}"><label>Internal note (customer ko nazar nahi aata)</label><textarea id="nn" rows="2" maxlength="500">${esc(o.note)}</textarea>
 <p style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem"><button id="bs">Update status</button><button class="o" id="bp">Update payment</button><button class="o" id="bd">Save courier / note</button><button class="o" id="bi">Print invoice</button><button class="o" id="bl">Print parcel label</button><a class="b o" style="border:1px solid var(--gold);background:none;color:var(--gold);text-decoration:none" target=_blank rel=noopener href="${esc(w1)}">WhatsApp: confirm</a><a class="b o" style="border:1px solid var(--gold);background:none;color:var(--gold);text-decoration:none" target=_blank rel=noopener href="${esc(w2)}">WhatsApp: shipped</a><button class="r" id="bx">Delete</button><button class="o" onclick="$('#dlg').close()" style="margin-left:auto">Close</button></p>`;
 $('#bs').onclick=()=>setS(id);$('#bp').onclick=()=>setP(id);$('#bd').onclick=()=>setD(id);$('#bi').onclick=()=>pr([o],'inv');$('#bl').onclick=()=>pr([o],'lbl');$('#bx').onclick=()=>delO(id);$('#dlg').showModal()};
const setS=async id=>{try{const v=$('#ns').value;await api('&action=status&id='+encodeURIComponent(id)+'&status='+encodeURIComponent(v));const o=O.find(x=>x.id===id);if(o.status!==v){o.status=v;o.history=(o.history||[]).concat({s:v,at:new Date().toISOString()})}$('#dlg').close();drawO();toast('Status updated')}catch(e){toast(e.message)}};
const setP=async id=>{try{const v=$('#np').value;await api('&action=paid&id='+encodeURIComponent(id)+'&paid='+encodeURIComponent(v));O.find(x=>x.id===id).paid=v;$('#dlg').close();drawO();toast('Payment updated')}catch(e){toast(e.message)}};
const setD=async id=>{try{const d={courier:$('#nc').value.trim(),track:$('#nt').value.trim(),note:$('#nn').value.trim()};await post({action:'update',id,...d});Object.assign(O.find(x=>x.id===id),d);$('#dlg').close();drawO();toast('Saved')}catch(e){toast(e.message)}};
const delO=async id=>{if(!confirm('Order '+id+' hamesha ke liye delete karein? Ye wapas nahi ho sakta. (Sirf cancel karna ho to Status > Cancelled use karein.)'))return;try{await post({action:'delete',id});O=O.filter(x=>x.id!==id);N=Math.max(0,N-1);$('#dlg').close();drawO();toast('Order deleted')}catch(e){toast(e.message)}};
const csv=()=>{if(!VL.length)return toast('Export ke liye koi order nahi');const c=v=>{v=String(v==null?'':v);if(/^[=@\t\r]|^[+-][^0-9 ]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'},
 H=['Order','Date','Status','Name','Phone','City','Address','Items','Subtotal','Delivery','Total','Payment','Paid','Reference','Courier','Tracking','Note','Source'],
 R=VL.map(o=>[o.id,dt(o.date),o.status,o.name,o.phone,o.city,o.addr,o.items.map(i=>i.name+' x '+i.qty).join('; '),o.subtotal,o.fee,o.total,o.pay,o.paid||'Unpaid',o.tid,o.courier,o.track,o.note,o.source]),
 b=new Blob(['﻿'+[H,...R].map(r=>r.map(c).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='jasbaan-orders-'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
const newO=async()=>{
 let pl=await site('products.js','[',']');if(!pl){try{await loadP();pl=P}catch(e){pl=[]}}const cf=await site('store-config.js','{','}')||{};
 const pays=['Cash on Delivery',...(cf.payments||[]).filter(m=>m.type&&m.type!=='cod').map(m=>m.label)],opts='<option value="">Choose product...</option>'+pl.filter(p=>p.price!=null).map(p=>`<option value="${esc(p.id)}" data-n="${esc(p.name)}" data-p="${Number(p.sale||p.price)}">${esc(p.name)} (${pkr(p.sale||p.price)})</option>`).join('')+'<option value="_">Other item</option>';
 const line=()=>`<div class="ln2"><select class="pi">${opts}</select><input class="pn" placeholder="Item name" maxlength="80"><input class="pq" type="number" min="1" max="99" value="1" title="Qty"><input class="pp" type="number" min="0" placeholder="Price" title="Price each"><button type="button" class="o" onclick="this.parentNode.remove()">&times;</button></div>`;
 $('#dlg').innerHTML=`<form id="nf"><h3>New order (manual)</h3><p><small>WhatsApp, Instagram ya phone par aaye order yahan likhein. Ye bhi list, labels aur sales mein aayega.</small></p>
 <label>Customer name</label><input name="name" required maxlength="80"><label>Phone</label><input name="phone" type="tel" required pattern="[0-9+ ]{10,15}" maxlength="15" title="Digits only, 10 to 15 characters"><label>Address</label><textarea name="addr" rows="2" required maxlength="300"></textarea><label>City</label><input name="city" required maxlength="60">
 <label>Items</label><div id="ls">${line()}</div><button type="button" class="o" id="al">+ Add item</button>
 <div class="g"><div><label>Delivery fee PKR</label><input name="fee" type="number" min="0" value="${Number(cf.deliveryFee)||0}"></div><div><label>Payment method</label><select name="pay">${pays.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div><label>Payment status</label><select name="paid"><option>Unpaid</option><option>Pending</option><option>Paid</option></select></div><div><label>Order came from</label><select name="src">${['WhatsApp','Instagram','Facebook','Phone call','Walk-in','Other'].map(m=>`<option>${m}</option>`).join('')}</select></div></div>
 <label>Internal note (optional)</label><textarea name="note" rows="2" maxlength="500"></textarea><p style="display:flex;gap:.6rem;margin-top:1rem"><button>Create order</button><button type="button" class="o" onclick="$('#dlg').close()">Cancel</button></p></form>`;
 $('#dlg').showModal();$('#al').onclick=()=>$('#ls').insertAdjacentHTML('beforeend',line());
 $('#ls').onchange=e=>{if(!e.target.classList.contains('pi'))return;const r=e.target.parentNode,o=e.target.selectedOptions[0];if(o.dataset.p){r.querySelector('.pn').value=o.dataset.n;r.querySelector('.pp').value=o.dataset.p}else if(o.value==='_'){r.querySelector('.pn').value='';r.querySelector('.pp').value=''}};
 $('#nf').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),items=[...document.querySelectorAll('#ls .ln2')].map(r=>({id:r.querySelector('.pi').value==='_'?'':r.querySelector('.pi').value,name:r.querySelector('.pn').value.trim(),qty:+r.querySelector('.pq').value||1,price:+r.querySelector('.pp').value||0})).filter(i=>i.name);
  try{if(!items.length)throw Error('Kam az kam ek item likhein');const r=await post({action:'add',order:{name:d.get('name'),phone:d.get('phone'),addr:d.get('addr'),city:d.get('city'),items,fee:d.get('fee'),pay:d.get('pay'),paid:d.get('paid'),source:'Manual: '+d.get('src'),note:d.get('note')}});$('#dlg').close();await viewO();toast('Order '+r.id+' ban gaya')}catch(er){toast(er.message)}}};
const printAll=()=>{const L=O.filter(o=>o.status==='New'||o.status==='Confirmed');L.length?pr(L,'lbl'):toast('Koi pending order nahi')};
const pr=(L,k)=>{const w=open('','_blank');if(!w)return toast('Popup allow karein');
 const css='body{font:14px/1.45 Arial,sans-serif;color:#000;margin:0}.p{padding:18px;page-break-after:always}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #999;padding:5px;text-align:left}.r{text-align:right}h1,h2{margin:0 0 6px}.l{border:2px solid #000;margin:8px;padding:12px;width:100mm;min-height:140mm;page-break-after:always}.big{font-size:20px;font-weight:700}.cod{border:2px dashed #000;padding:8px;margin:10px 0;font-size:18px;text-align:center}@page{margin:6mm}';
 const inv=o=>`<div class=p><h1>${esc(S.storeName)}</h1><div>${esc(S.storePhone)}</div><h2 style="margin-top:14px">Order Summary: ${esc(o.id)}</h2><div>Date: ${dt(o.date)}</div><p><b>Bill to:</b> ${esc(o.name)}, ${esc(o.phone)}<br>${esc(o.addr)}, ${esc(o.city)}</p>
  <table><tr><th>Item</th><th class=r>Qty</th><th class=r>Price</th><th class=r>Amount</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td class=r>${i.qty}</td><td class=r>${pkr(i.price)}</td><td class=r>${pkr(i.price*i.qty)}</td></tr>`).join('')}<tr><td colspan=3 class=r>Delivery</td><td class=r>${pkr(o.fee)}</td></tr><tr><td colspan=3 class=r><b>Total</b></td><td class=r><b>${pkr(o.total)}</b></td></tr></table><p>Payment: ${esc(o.pay)} (${esc(o.paid||'Unpaid')})</p><p>Thank you for shopping with ${esc(S.storeName)}.</p></div>`;
 const lbl=o=>`<div class=l><small>FROM</small><div><b>${esc(S.storeName)}</b> | ${esc(S.storePhone)}</div><hr><small>DELIVER TO</small><div class=big>${esc(o.name)}</div><div class=big>${esc(o.phone)}</div><div>${esc(o.addr)}</div><div class=big>${esc(o.city)}</div>${/cash/i.test(o.pay)&&o.paid!=='Paid'?`<div class=cod>COD: collect ${pkr(o.total)}</div>`:'<div class=cod>PREPAID</div>'}<div>${o.items.map(i=>esc(i.name)+' x '+i.qty).join(', ')}</div><p><small>Order ${esc(o.id)} | ${dt(o.date)}</small></p></div>`;
 w.document.write(`<!doctype html><title>Print</title><style>${css}</style>${L.map(k==='inv'?inv:lbl).join('')}<script>onload=()=>print()<\/script>`);w.document.close()};
/* ---------- Settings ---------- */
const viewS=()=>{const f=[['repo','GitHub repo (username/repo-name)'],['branch','Branch'],['token','GitHub token (Contents: read & write)','password'],['orderUrl','Orders URL (Vercel backend ke liye khali chhor dein)'],['key','Admin key (same as ADMIN_KEY in Code.gs)','password'],['storeName','Store name (invoice/label)'],['storePhone','Store phone (invoice/label)']];
 $('#m').innerHTML='<p><small>Ye sab sirf is browser mein save hota hai. Admin ya token kisi ko na dein.</small></p><form id="sf">'+f.map(([k,l,t])=>`<label>${l}</label><input name="${k}" type="${t||'text'}" value="${esc(S[k]||'')}" autocomplete="off">`).join('')+'<p><button>Save settings</button></p></form>';
 $('#sf').onsubmit=e=>{e.preventDefault();new FormData(e.target).forEach((v,k)=>S[k]=String(v).trim());persist();toast('Saved')};siteS()};
const siteS=async()=>{const el=document.createElement('div');el.innerHTML='<h3 style="color:var(--gold);margin-top:2rem">Website settings (GitHub par save hoti hain)</h3><p><small>Loading...</small></p>';$('#m').append(el);
 let C={payments:[]},ss;try{const r=await gh('store-config.js'),t=unb64(r.content);ss=r.sha;C=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}catch(e){el.innerHTML+='<p><small>'+esc(e.message)+'</small></p>'}
 const pm=t=>(C.payments||[]).find(m=>m.type===t)||{};
 const f=[['orderUrl','Orders URL (Vercel: /api/order)',C.orderUrl],['deliveryFee','Delivery fee PKR',C.deliveryFee],['whatsapp','WhatsApp number (923...)',C.whatsapp],['ep','Easypaisa number',pm('easypaisa').account],['ept','Easypaisa account title',pm('easypaisa').title],['jc','JazzCash number',pm('jazzcash').account],['jct','JazzCash account title',pm('jazzcash').title],['bk','Bank transfer details (bank, IBAN, title)',pm('bank').details]];
 el.innerHTML='<h3 style="color:var(--gold);margin-top:2rem">Website settings (GitHub par save hoti hain)</h3><p><small>Jis method ka number/detail khali ho woh checkout par nahi aata.</small></p><form id="wf">'+f.map(([k,l,v])=>`<label>${l}</label><input name="${k}" value="${esc(v||'')}">`).join('')+'<p><button>Save to website</button></p></form>';
 $('#wf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),n={orderUrl:d.orderUrl.trim(),deliveryFee:+d.deliveryFee||0,whatsapp:d.whatsapp.trim(),payments:[{label:'Cash on Delivery',type:'cod'},{label:'Easypaisa',type:'easypaisa',account:d.ep.trim(),title:d.ept.trim()},{label:'JazzCash',type:'jazzcash',account:d.jc.trim(),title:d.jct.trim()},{label:'Bank Transfer',type:'bank',details:d.bk.trim()}]};
  try{const r=await gh('store-config.js',{method:'PUT',body:JSON.stringify({message:'Update store settings',branch:(S.branch||'main').trim()||'main',...(ss?{sha:ss}:{}),content:b64('/* Store settings. Edit through admin.html > Settings > Website settings. */\nwindow.STORE = '+JSON.stringify(n,null,1)+';\n')})});ss=r.content.sha;S.orderUrl=n.orderUrl||S.orderUrl;persist();toast('Saved. Site 1-2 minute mein update ho jayegi.')}catch(er){toast(er.message)}}};
const go=t=>{tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({orders:viewO,products:viewP,settings:viewS})[t]()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t));go(S.key?'orders':'settings');
</script></body></html>
