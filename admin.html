<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Jasbaan Admin</title>
<style>
:root{--bg:#0A0907;--card:#14110C;--gold:#D4AF5A;--ivory:#F4EBDA;--mut:#CBB89A;--line:#2E2616}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ivory);font:15px/1.5 system-ui,sans-serif}
header{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.8rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header b{color:var(--gold);letter-spacing:.12em;margin-right:auto}main{padding:1rem;max-width:1100px;margin:auto}
button,.b{background:var(--gold);color:#0A0907;border:0;border-radius:4px;padding:.5rem .9rem;font:600 .85rem system-ui;cursor:pointer}
button.o{background:none;color:var(--gold);border:1px solid var(--gold)}button.r{background:#8a2b2b;color:#fff}.tab.on{outline:2px solid var(--ivory)}
input,select,textarea{width:100%;background:#0d0b08;color:var(--ivory);border:1px solid var(--line);border-radius:4px;padding:.5rem;font:inherit}
label{display:block;font-size:.78rem;color:var(--mut);margin:.6rem 0 .15rem}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.row{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.6rem;margin:.5rem 0}.row img{width:54px;height:68px;object-fit:cover;border-radius:3px}
.row>div{flex:1;min-width:0}small{color:var(--mut)}.st{padding:.5rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:6px}.st b{display:block;font-size:1.4rem;color:var(--gold)}
table{width:100%;border-collapse:collapse}td,th{padding:.55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.88rem}th{color:var(--gold)}tr.c{cursor:pointer}tr.c:hover{background:var(--card)}
dialog{background:var(--card);color:var(--ivory);border:1px solid var(--gold);border-radius:8px;width:min(680px,94vw);max-height:92vh}::backdrop{background:#000a}
.badge{padding:.1rem .5rem;border-radius:99px;background:#2a2312;color:var(--gold);font-size:.75rem}#msg{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:.5rem 1rem;border-radius:6px;display:none;z-index:9}
.scroll{overflow-x:auto}
</style></head><body>
<header><b>JASBAAN ADMIN</b><button class="tab o" data-t="orders">Orders</button><button class="tab o" data-t="products">Products</button><button class="tab o" data-t="settings">Settings</button></header>
<main id="m"></main><dialog id="dlg"></dialog><div id="msg"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=JSON.parse(localStorage.getItem('jbadmin')||'{}');S={branch:'main',storeName:'The Jasbaan Perfume',storePhone:'0371 2272628',...S};
const persist=()=>localStorage.setItem('jbadmin',JSON.stringify(S)),pkr=n=>'PKR '+Number(n||0).toLocaleString('en-US');
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3500)};
const STAT=['New','Confirmed','Shipped','Delivered','Cancelled'];let P=[],sha='',O=[],tab='orders';
/* ---------- GitHub (products) ---------- */
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const gh=async(path,opt={})=>{if(!S.repo||!S.token)throw Error('Settings mein GitHub repo aur token daalein');
 const r=await fetch(`https://api.github.com/repos/${S.repo}/contents/${path}`+(opt.method?'':`?ref=${S.branch}`),{...opt,headers:{Authorization:'Bearer '+S.token,Accept:'application/vnd.github+json'}});
 const j=await r.json();if(!r.ok)throw Error(j.message||r.status);return j};
const loadP=async()=>{const r=await gh('products.js'),t=unb64(r.content);sha=r.sha;P=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1))};
const saveP=async msg=>{const r=await gh('products.js',{method:'PUT',body:JSON.stringify({message:msg,branch:S.branch,sha,
 content:b64('/* Product data. Edit through admin.html (or by hand: keep valid JSON). */\nconst PRODUCTS = '+JSON.stringify(P,null,1)+';\n')})});sha=r.content.sha;toast('Saved. Site 1-2 minute mein update ho jayegi.')};
/* ---------- Products ---------- */
const F=[['name','Name'],['id','ID (link, no spaces)'],['cat','Category'],['gender','Gender','Men,Women,Unisex'],['price','Price PKR (empty = Price on WhatsApp)','n'],['sale','Sale price (optional)','n'],['tag','Badge text (e.g. Launch offer)'],['size','Size'],['tagline','Tagline'],['lasting','Lasting'],['season','Season'],['occasion','Occasion']];
const viewP=async()=>{$('#m').innerHTML='<p>Loading...</p>';try{await loadP()}catch(e){return $('#m').innerHTML='<p>'+esc(e.message)+'</p>'}
 $('#m').innerHTML=`<button onclick="editP(-1)">+ Add product</button>`+P.map((p,i)=>`<div class="row"><img src="${esc(p.img)}" alt=""><div><b>${esc(p.name)}</b> ${p.best?'<span class=badge>Best seller</span>':''}<br><small>${esc(p.cat)} | ${esc(p.gender)} | ${p.price==null?'Price on WhatsApp':pkr(p.price)}${p.sale?' (sale '+pkr(p.sale)+')':''}</small></div>
 <button class="o" onclick="mv(${i},-1)">↑</button><button class="o" onclick="mv(${i},1)">↓</button><button onclick="editP(${i})">Edit</button></div>`).join('')};
const mv=async(i,d)=>{const j=i+d;if(j<0||j>=P.length)return;[P[i],P[j]]=[P[j],P[i]];try{await saveP('Reorder products');viewP()}catch(e){toast(e.message)}};
const editP=i=>{const p=i<0?{img:'',best:false,points:[]}:P[i];$('#dlg').innerHTML=`<form id="pf"><h3>${i<0?'New product':'Edit '+esc(p.name)}</h3><div class="g">`+F.map(([k,l,t])=>`<div><label>${l}</label>`+(t&&t!=='n'?`<select name="${k}">${t.split(',').map(o=>`<option ${p[k]==o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${k}" ${t==='n'?'type=number min=0':''} value="${esc(p[k]??'')}">`)+'</div>').join('')+`</div>
 <label>Description</label><textarea name="desc" rows="3">${esc(p.desc)}</textarea><label>Highlights (one per line)</label><textarea name="points" rows="3">${esc((p.points||[]).join('\n'))}</textarea>
 <label>Long text (product page, optional)</label><textarea name="long" rows="3">${esc(p.long)}</textarea><label>Fragrance notes (only if confirmed)</label><input name="notes" value="${esc(p.notes)}">
 <label>Main photo ${p.img?'(current: '+esc(p.img)+')':''}</label><input type="file" name="f1" accept="image/*"><label>Second photo (optional)</label><input type="file" name="f2" accept="image/*">
 <label><input type="checkbox" name="best" ${p.best?'checked':''} style="width:auto"> Best seller</label><p style="display:flex;gap:.6rem;margin-top:1rem"><button>Save</button><button type="button" class="o" onclick="$('#dlg').close()">Cancel</button>${i>=0?'<button type="button" class="r" onclick="delP('+i+')" style="margin-left:auto">Delete</button>':''}</p></form>`;
 $('#dlg').showModal();$('#pf').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),n={...p};
  try{F.forEach(([k,,t])=>{const v=String(d.get(k)||'').trim();n[k]=t==='n'?(v===''?null:+v):v});
   ['desc','long','notes'].forEach(k=>n[k]=String(d.get(k)||'').trim());n.points=String(d.get('points')).split('\n').map(s=>s.trim()).filter(Boolean);n.best=d.get('best')==='on';
   n.id=n.id.toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'')||'product-'+Date.now();if(!n.name)throw Error('Name zaroori hai');
   if(P.some((x,j)=>x.id===n.id&&j!==i))throw Error('Ye ID pehle se maujood hai');
   for(const [f,k] of [['f1','img'],['f2','img2']]){const file=d.get(f);if(file&&file.size){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''),path=`images/${n.id}${k==='img2'?'-2':''}-${Date.now()}.${ext}`;
     const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file)});
     await gh(path,{method:'PUT',body:JSON.stringify({message:'Upload '+path,branch:S.branch,content:data})});n[k]=path}}
   if(i<0)P.unshift(n);else P[i]=n;await saveP((i<0?'Add ':'Update ')+n.name);$('#dlg').close();viewP()}catch(er){toast(er.message)}}};
const delP=async i=>{if(!confirm('Delete '+P[i].name+'?'))return;const n=P[i].name;P.splice(i,1);try{await saveP('Delete '+n);$('#dlg').close();viewP()}catch(e){toast(e.message)}};
/* ---------- Orders ---------- */
const api=async q=>{if(!S.orderUrl||!S.key)throw Error('Settings mein Orders URL aur Admin key daalein');const r=await(await fetch(S.orderUrl+'?key='+encodeURIComponent(S.key)+q)).json();if(!r.ok)throw Error(r.error||'Error');return r};
const dt=s=>new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const viewO=async()=>{$('#m').innerHTML='<p>Loading...</p>';try{O=(await api('&action=list')).orders}catch(e){return $('#m').innerHTML='<p>'+esc(e.message)+'</p>'}drawO()};
const drawO=(f='',q='')=>{const td=new Date().toDateString(),L=O.filter(o=>(!f||o.status===f)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));
 const live=O.filter(o=>o.status!=='Cancelled');
 $('#m').innerHTML=`<div class="g" style="margin-bottom:1rem"><div class=st><small>Today</small><b>${O.filter(o=>new Date(o.date).toDateString()===td).length}</b></div><div class=st><small>New (pending)</small><b>${O.filter(o=>o.status==='New').length}</b></div><div class=st><small>Total orders</small><b>${O.length}</b></div><div class=st><small>Sales (not cancelled)</small><b>${pkr(live.reduce((a,o)=>a+Number(o.total||0),0))}</b></div></div>
 <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem"><input id="q" placeholder="Search name, phone, city, ID" value="${esc(q)}" style="flex:1;min-width:180px"><select id="f" style="width:auto"><option value="">All status</option>${STAT.map(s=>`<option ${f===s?'selected':''}>${s}</option>`).join('')}</select><button class="o" onclick="viewO()">Refresh</button><button onclick="printAll()">Print labels (New+Confirmed)</button></div>
 <div class="scroll"><table><tr><th>Order</th><th>Customer</th><th>City</th><th>Total</th><th>Status</th></tr>${L.map(o=>`<tr class="c" onclick="det('${esc(o.id)}')"><td>${esc(o.id)}<br><small>${dt(o.date)}</small></td><td>${esc(o.name)}<br><small>${esc(o.phone)}</small></td><td>${esc(o.city)}</td><td>${pkr(o.total)}</td><td><span class=badge>${esc(o.status)}</span></td></tr>`).join('')||'<tr><td colspan=5>No orders</td></tr>'}</table></div>`;
 $('#q').oninput=e=>drawO($('#f').value,e.target.value.toLowerCase());$('#f').onchange=e=>drawO(e.target.value,$('#q').value.toLowerCase());$('#q').focus();$('#q').setSelectionRange(q.length,q.length)};
const det=id=>{const o=O.find(x=>x.id===id);$('#dlg').innerHTML=`<h3>${esc(o.id)} <span class=badge>${esc(o.status)}</span></h3><small>${dt(o.date)}</small>
 <p><b>${esc(o.name)}</b> | <a style="color:var(--gold)" href="tel:${esc(o.phone)}">${esc(o.phone)}</a> | <a style="color:var(--gold)" target=_blank rel=noopener href="https://wa.me/${esc(String(o.phone).replace(/\D/g,'').replace(/^0/,'92'))}">WhatsApp</a><br>${esc(o.addr)}, ${esc(o.city)}</p>
 <table>${o.items.map(i=>`<tr><td>${esc(i.name)} x ${i.qty}</td><td>${pkr(i.price*i.qty)}</td></tr>`).join('')}<tr><td>Delivery</td><td>${pkr(o.fee)}</td></tr><tr><td><b>Total (${esc(o.pay)})</b></td><td><b>${pkr(o.total)}</b></td></tr></table>
 <p><small>Placed from: ${esc(o.source)}<br>Device: ${esc(o.device)}</small></p><label>Status</label><select id="ns">${STAT.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>
 <p style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem"><button onclick="setS('${esc(o.id)}')">Update status</button><button class="o" onclick="pr([O.find(x=>x.id==='${esc(o.id)}')],'inv')">Print invoice</button><button class="o" onclick="pr([O.find(x=>x.id==='${esc(o.id)}')],'lbl')">Print parcel label</button><button class="o" onclick="$('#dlg').close()" style="margin-left:auto">Close</button></p>`;$('#dlg').showModal()};
const setS=async id=>{try{await api('&action=status&id='+encodeURIComponent(id)+'&status='+$('#ns').value);O.find(x=>x.id===id).status=$('#ns').value;$('#dlg').close();drawO();toast('Status updated')}catch(e){toast(e.message)}};
const printAll=()=>{const L=O.filter(o=>o.status==='New'||o.status==='Confirmed');L.length?pr(L,'lbl'):toast('Koi pending order nahi')};
const pr=(L,k)=>{const w=open('','_blank');if(!w)return toast('Popup allow karein');
 const css='body{font:14px/1.45 Arial,sans-serif;color:#000;margin:0}.p{padding:18px;page-break-after:always}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #999;padding:5px;text-align:left}.r{text-align:right}h1,h2{margin:0 0 6px}.l{border:2px solid #000;margin:8px;padding:12px;width:100mm;min-height:140mm;page-break-after:always}.big{font-size:20px;font-weight:700}.cod{border:2px dashed #000;padding:8px;margin:10px 0;font-size:18px;text-align:center}@page{margin:6mm}';
 const inv=o=>`<div class=p><h1>${esc(S.storeName)}</h1><div>${esc(S.storePhone)}</div><h2 style="margin-top:14px">Order Summary: ${esc(o.id)}</h2><div>Date: ${dt(o.date)}</div><p><b>Bill to:</b> ${esc(o.name)}, ${esc(o.phone)}<br>${esc(o.addr)}, ${esc(o.city)}</p>
  <table><tr><th>Item</th><th class=r>Qty</th><th class=r>Price</th><th class=r>Amount</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td class=r>${i.qty}</td><td class=r>${pkr(i.price)}</td><td class=r>${pkr(i.price*i.qty)}</td></tr>`).join('')}<tr><td colspan=3 class=r>Delivery</td><td class=r>${pkr(o.fee)}</td></tr><tr><td colspan=3 class=r><b>Total</b></td><td class=r><b>${pkr(o.total)}</b></td></tr></table><p>Payment: ${esc(o.pay)}</p><p>Thank you for shopping with ${esc(S.storeName)}.</p></div>`;
 const lbl=o=>`<div class=l><small>FROM</small><div><b>${esc(S.storeName)}</b> | ${esc(S.storePhone)}</div><hr><small>DELIVER TO</small><div class=big>${esc(o.name)}</div><div class=big>${esc(o.phone)}</div><div>${esc(o.addr)}</div><div class=big>${esc(o.city)}</div>${/cash/i.test(o.pay)?`<div class=cod>COD: collect ${pkr(o.total)}</div>`:'<div class=cod>PREPAID</div>'}<div>${o.items.map(i=>esc(i.name)+' x '+i.qty).join(', ')}</div><p><small>Order ${esc(o.id)} | ${dt(o.date)}</small></p></div>`;
 w.document.write(`<!doctype html><title>Print</title><style>${css}</style>${L.map(k==='inv'?inv:lbl).join('')}<script>onload=()=>print()<\/script>`);w.document.close()};
/* ---------- Settings ---------- */
const viewS=()=>{const f=[['repo','GitHub repo (username/repo-name)'],['branch','Branch'],['token','GitHub token (Contents: read & write)','password'],['orderUrl','Orders web app URL (Apps Script)'],['key','Admin key (same as ADMIN_KEY in Code.gs)','password'],['storeName','Store name (invoice/label)'],['storePhone','Store phone (invoice/label)']];
 $('#m').innerHTML='<p><small>Ye sab sirf is browser mein save hota hai. Admin ya token kisi ko na dein.</small></p><form id="sf">'+f.map(([k,l,t])=>`<label>${l}</label><input name="${k}" type="${t||'text'}" value="${esc(S[k]||'')}" autocomplete="off">`).join('')+'<p><button>Save settings</button></p></form>';
 $('#sf').onsubmit=e=>{e.preventDefault();new FormData(e.target).forEach((v,k)=>S[k]=String(v).trim());persist();toast('Saved')}};
const go=t=>{tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({orders:viewO,products:viewP,settings:viewS})[t]()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t));go(S.repo&&S.orderUrl?'orders':'settings');
</script></body></html>
